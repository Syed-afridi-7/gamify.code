[build]
  # Tell Netlify our Next.js app lives in the 'frontend' folder
  base = "frontend"

  # Standard Next.js build command
  command = "npm run build"

  # Netlify Next.js plugin requires this to be '.next'
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# This plugin is REQUIRED for Next.js SSR, API routes, and dynamic pages to work on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"
